<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login & Register</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container">

    <!-- LOGIN -->
    <div id="login" class="form-box active">

        <form action="/login" method="post">
            <h2>Login</h2>

            <!-- LOGIN ERROR -->
            <p class="error-message"
               th:if="${session.login_error != null and session.login_error != ''}"
               th:text="${session.login_error}">
            </p>

            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">Login</button>

            <p>
                Don't have an account?
                <a href="#" onclick="showForm('register')">Register</a>
            </p>
        </form>

    </div>

    <!-- REGISTER -->
    <div id="register" class="form-box">

        <form action="/register" method="post">
            <h2>Register</h2>

            <!-- REGISTER ERROR -->
            <p class="error-message"
               th:if="${session.register_error != null and session.register_error != ''}"
               th:text="${session.register_error}">
            </p>

            <input type="text" name="name" placeholder="Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>

            <select id="role" name="role" required onchange="toggleSpecialization()">
                <option value="user">User</option>
                <option value="admin">Admin</option>
            </select>

            <div id="specialization-box" style="display: none;">

                <label class="spe-label">Specialization</label>

                <select name="specialization">
                    <option value="Cybersecurity">Cybersecurity</option>
                    <option value="Network">Network</option>
                    <option value="Hardware">Hardware</option>
                    <option value="Software">Software</option>
                    <option value="Database">Database</option>
                </select>

            </div>

            <button type="submit">Register</button>

            <p>
                Already have an account?
                <a href="#" onclick="showForm('login')">Login</a>
            </p>
        </form>

    </div>

</div>

<script src="/js/script.js" defer></script>

</body>
</html>
